<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date 3D - Espacial</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #050505; font-family: 'Helvetica Neue', sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; --poster-color: transparent; }
        .ui-container { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); text-align: center; color: #fff; pointer-events: none; z-index: 10; }
        .ar-button { background-color: rgba(255, 255, 255, 0.95); color: #000; border: none; border-radius: 50px; padding: 14px 28px; font-weight: 600; cursor: pointer; pointer-events: auto; }
    </style>
</head>
<body>

    <!-- Se han añadido atributos de iluminación y sombras -->
    <model-viewer 
        src="space1.glb" 
        skybox-image="espacioHDRI.png" 
        environment-image="espacioHDRI.png"
        exposure="1.5" 
        shadow-intensity="1.2"
        shadow-softness="0.8"
        tone-mapping="aces"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-placement="floor" 
        camera-controls
        auto-rotate>
        
        <button slot="ar-button" class="ar-button">VER EN TU ESPACIO</button>
    </model-viewer>

    <div class="ui-container">
        <p>Apunta al suelo para fijar la nave</p>
    </div>

</body>
</html>
