<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date - Misión Espacial</title>
    
    <!-- Librería Core Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        /* Estilos Globales */
        body { margin: 0; padding: 0; background-color: #050505; font-family: 'Helvetica Neue', sans-serif; overflow: hidden; color: white; }
        
        /* 1. Pantalla de Inicio (Formulario) */
        #intro-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('./espacioHDRI.png'); 
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center;
            z-index: 20; transition: opacity 1s ease-out;
        }

        /* Diseño estético del panel */
        .hologram-panel {
            background: rgba(10, 10, 15, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.2); border-top: 4px solid #00FFFF;
            padding: 30px; border-radius: 12px; width: 85%; max-width: 320px;
            text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(0, 255, 255, 0.15);
        }

        .hologram-panel h3 { margin: 0 0 10px 0; color: #00FFFF; font-weight: 400; letter-spacing: 3px; }
        .hologram-panel p { font-size: 0.85rem; margin-bottom: 25px; opacity: 0.8; }

        .minimal-input {
            width: 100%; box-sizing: border-box; background: transparent; border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4); color: white; padding: 10px 0;
            margin-bottom: 25px; font-size: 1rem; outline: none; transition: border-color 0.3s ease; text-align: center;
        }
        .minimal-input:focus { border-bottom: 1px solid #00FFFF; }

        .neon-btn {
            width: 100%; background: rgba(0, 255, 255, 0.1); color: #00FFFF; border: 1px solid #00FFFF;
            padding: 12px; border-radius: 6px; font-size: 0.9rem; letter-spacing: 2px;
            cursor: pointer; transition: all 0.3s ease; font-weight: bold;
        }
        .neon-btn:hover { background: rgba(0, 255, 255, 0.2); }
        .neon-btn:active { background: #00FFFF; color: #000; }

        /* 2. Visor 3D */
        model-viewer { 
            width: 100vw; height: 100vh; --poster-color: transparent; display: none; 
        }
        
        /* Botón de Realidad Aumentada */
        .ar-button { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.95); color: #000; border: none; 
            border-radius: 50px; padding: 16px 32px; font-weight: 600; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 1rem;
        }

        /* Estilos del Prompt AR (Manito de escaneo) */
        .ar-prompt-container {
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
            text-align: center; color: white; background: rgba(0,0,0,0.6);
            padding: 10px 20px; border-radius: 8px; pointer-events: none;
        }
        .hand-icon {
            width: 40px; filter: invert(1); animation: sway 2s infinite ease-in-out;
        }
        @keyframes sway {
            0%, 100% { transform: translateX(-25%); }
            50% { transform: translateX(25%); }
        }
    </style>
</head>
<body>

    <!-- ELEMENTO DE AUDIO -->
    <audio id="audio-fondo" src="./musica.mp3" preload="auto"></audio>

    <!-- PANTALLA 1: FORMULARIO -->
    <div id="intro-screen">
        <div class="hologram-panel">
            <h3>MISIÓN: SAVE THE DATE</h3>
            <p>Registra tu identidad en la bitácora para acceder a las coordenadas.</p>
            
            <input type="text" id="guest-name" placeholder="Tu Nombre y Apellido" class="minimal-input">
            <button id="btn-confirmar" class="neon-btn">INICIAR SECUENCIA</button>
            <p id="loading-msg" style="display:none; color: #00FFFF; margin-top: 15px; font-size: 0.8rem;">Sincronizando...</p>
            
            <!-- Mensaje de éxito con instrucciones extra -->
            <p id="success-msg" style="display:none; color: #00FFFF; margin-top: 15px; font-size: 0.8rem; line-height: 1.4;">
                ¡Identidad confirmada! <br><br>
                <span style="color: white;">Tip: Apunta a una mesa iluminada, mueve tu celular en círculos y <b>arrastra la nave con un dedo</b> para posicionarla.</span>
            </p>
        </div>
    </div>

    <!-- PANTALLA 2: VISOR 3D Y AR -->
    <model-viewer id="visor-espacial" 
        src="./escenario1.glb" 
        skybox-image="./espacioHDRI.png" 
        environment-image="./espacioHDRI.png"
        exposure="1.5" 
        shadow-intensity="1.2"
        tone-mapping="aces"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-placement="floor" 
        camera-controls
        auto-rotate>
        
        <button slot="ar-button" class="ar-button">FIJAR NAVE EN TU ESPACIO</button>

        <!-- UI DE ESCANEO DE SUPERFICIE -->
        <div slot="ar-prompt" class="ar-prompt-container">
            <img src="https://modelviewer.dev/shared-assets/icons/hand.png" class="hand-icon" alt="Mover celular">
            <p style="margin: 5px 0 0 0; font-size: 0.9rem;">Mueve tu celular para detectar la mesa</p>
        </div>
    </model-viewer>

    <!-- Lógica JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://buzzer-67109-default-rtdb.firebaseio.com" 
        };
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const btnConfirmar = document.querySelector('#btn-confirmar');
        const inputName = document.querySelector('#guest-name');
        const introScreen = document.querySelector('#intro-screen');
        const visorEspacial = document.querySelector('#visor-espacial');
        const loadingMsg = document.querySelector('#loading-msg');
        const successMsg = document.querySelector('#success-msg');
        
        const audioFondo = document.querySelector('#audio-fondo');

        function iniciarExperiencia3D() {
            audioFondo.play().catch(e => console.log("Error al reproducir audio:", e));
            
            // Damos 4 segundos para que lean las instrucciones antes de abrir el 3D
            setTimeout(() => {
                introScreen.style.opacity = '0'; 
                setTimeout(() => {
                    introScreen.style.display = 'none';
                    visorEspacial.style.display = 'block'; 
                }, 1000);
            }, 4000); 
        }

        btnConfirmar.addEventListener('click', () => {
            const nombre = inputName.value.trim();
            if(nombre !== "") {
                btnConfirmar.style.display = 'none';
                loadingMsg.style.display = 'block';

                const rsvpRef = ref(database, 'asistentes-boda');
                const nuevoAsistenteRef = push(rsvpRef);
                
                set(nuevoAsistenteRef, {
                    nombre: nombre,
                    timestamp: new Date().toISOString()
                }).then(() => {
                    loadingMsg.style.display = 'none';
                    successMsg.style.display = 'block'; // Mostramos las instrucciones
                    iniciarExperiencia3D();
                }).catch((error) => {
                    console.error("Fallo Firebase, avanzando...", error);
                    loadingMsg.style.display = 'none';
                    successMsg.style.display = 'block';
                    iniciarExperiencia3D();
                });
            } else {
                alert("Por favor, ingresa tu nombre para continuar.");
            }
        });
    </script>
</body>
</html>
